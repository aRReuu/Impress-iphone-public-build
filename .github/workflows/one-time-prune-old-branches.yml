name: One-time verified Impress branch consolidation

on:
  push:
    branches:
      - feature/impress-vault-device-write-qa
    paths:
      - .github/workflows/one-time-prune-old-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify branch SHAs, archive divergent history, remove only allowlisted refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feature/impress-vault-device-write-qa"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/obsolete-branches.txt" <<'REFS'
          feature/altstore-compat-ipa b12e707da2bd66fe3e7dabaa4523da2b85ee1af5
          feature/apple-native-r04-sdk27 d4d015fe57a3c29fd77c81afb5d8291d0600e2cb
          feature/impress-ai-api-questionpool-impl 075394bd46e849c9795758eb3dd03f412b169153
          feature/impress-ai-synthesis-preview-v1 46870f0ec10868e438711c5b55fce10a125b5cf5
          feature/impress-calibration-v01 c16c4a605c5b6018861ff1691d6e6abbba0d8901
          feature/impress-knowledge-loop-spec-v1 208cf9c1eba64196b1304b355951d309af5391ce
          feature/impress-v3-r04-2-build 627c27ba3c8a0001837371d2f1d9637f6aa964e9
          release/ipa-direct-download c83c95dbc425a1bb57afd49240ed06e4c0fd6615
          REFS
          # Verify ALL refs before the first destructive operation. Do not
          # clean anything if another model/user advanced a target branch.
          while read -r ref expected; do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch moved; no deletion was performed: $ref"
              exit 1
            fi
            case "$ref" in
              feature/impress-calibration-v01|release/ipa-direct-download)
                # Divergent historical branches are archived as TWO tags,
                # preserving reachable commits without counting as branches.
                ;;
              *)
                git merge-base --is-ancestor "$expected" "$GITHUB_SHA" || {
                  echo "::error::Not an ancestor: $ref"; exit 1;
                }
                ;;
            esac
          done < "$RUNNER_TEMP/obsolete-branches.txt"

          # Guard unique old histories before removing refs.
          while read -r ref tag expected; do
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$existing" ] && [ "$existing" != "$expected" ]; then
              echo "::error::Archive tag exists at another commit: $tag"; exit 1
            fi
            if [ -z "$existing" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$expected" >/dev/null
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$expected"
          done <<'ARCHIVE'
          feature/impress-calibration-v01 archive/2026-10-19-calibration-v01 c16c4a605c5b6018861ff1691d6e6abbba0d8901
          release/ipa-direct-download archive/2026-10-19-ipa-release-legacy c83c95dbc425a1bb57afd49240ed06e4c0fd6615
          ARCHIVE

          while read -r ref expected; do
            echo "Deleting only verified obsolete ref: $ref"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref" >/dev/null
          done < "$RUNNER_TEMP/obsolete-branches.txt"

          remaining="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' main feature/impress-vault-device-write-qa | sort)"
          if [ "$remaining" != "$expected" ]; then
            echo "::error::Unexpected branch count or remaining refs:"
            echo "$remaining"
            exit 1
          fi
          echo "EXACTLY_TWO_BRANCHES_VERIFIED"
