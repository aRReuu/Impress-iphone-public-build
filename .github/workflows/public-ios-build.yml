name: Impress V1.1 Development QA

on:
  push:
    branches:
      - main
      - feature/impress-duplex-loop-v1
      - 'feature/impress-chat-*'
      - 'feature/impress-excalidraw-*'
      - 'feature/impress-calibration-*'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Explicitly approved full-app unsigned IPA release candidate (never on push)'
        required: true
        type: boolean
        default: false
      validation_scope:
        description: 'Chat-only intermediate QA or complete pre-release regression'
        required: true
        type: choice
        options: [chat, full]
        default: chat

permissions:
  contents: read

concurrency:
  group: impress-public-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-core:
    name: Portable Swift core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify public scope and source policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import pathlib, re, subprocess, sys
          p = pathlib.Path(".")
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          disallowed = [
              f for f in files
              if f.startswith(("Docs/", "docs/", "Pods/"))
              or "/xcuserdata/" in f or f.endswith((".xcuserstate", ".p12", ".mobileprovision", ".pem", ".p8"))
              or f.endswith("grandmother.jpg")
              or (f.endswith((".png", ".jpg")) and "/Resources/" in f
                  and not f.startswith("aReuImpress-iPhone/Resources/Assets.xcassets/AppIcon.appiconset/"))
          ]
          if disallowed:
              raise SystemExit("Forbidden published paths: " + repr(disallowed))
          x = (p / "aReuImpress-iPhone.xcodeproj/project.pbxproj").read_text()
          guard = (p / "aReuImpress-iPhone/Utils/Public/ImFileManager/ImObsidianManager.swift").read_text()
          assert not re.search(r"DEVELOPMENT_TEAM\s*=\s*[A-Z0-9]{8,}", x)
          assert 'IMPRESS_V3_CANDIDATE' in x
          assert re.search(r"productionWriteEnabled\s*=\s*false\b", guard)
          assert not re.search(r"productionWriteEnabled\s*=\s*true\b", guard)
          print("PUBLIC_SOURCE_POLICY PASS | files:", len(files))
          PY
      - name: Verify current product contract (static checks; NOT device acceptance)
        run: python3 .github/scripts/verify_product_contract.py
      - name: Swift toolchain
        run: swift --version
      - name: Execute portable Swift tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/ImpressReviewCore --parallel 2>&1 | tee out/swift-core-tests.log
      - name: Upload portable Swift results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impress-public-swift-core-logs
          path: out/
          retention-days: 14

  ios-native:
    name: macOS iOS Chat QA — no IPA on development pushes
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and neutral assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          xcodebuild -version | tee out/xcode-version.log
          python3 -m py_compile .github/scripts/generate_neutral_assets.py
          python3 .github/scripts/generate_neutral_assets.py | tee out/neutral-assets-manifest.json
      - name: Install reproducible CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version | tee out/cocoapods-version.log
          pod install --repo-update 2>&1 | tee out/pod-install.log
      - name: Build offline Mermaid/Markmap reader (no CDN at runtime)
        shell: bash
        run: |
          set -euo pipefail
          cd Scripts/DiagramReader
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          test -s ../../aReuImpress-iPhone/Resources/DiagramReader/reader.js
          test -s ../../aReuImpress-iPhone/Resources/MarkdownReader/reader.js
          test -s ../../aReuImpress-iPhone/Resources/MarkdownReader/graphs.js
          test -s ../../aReuImpress-iPhone/Resources/MarkdownReader/katex.min.css
          test -s ../../aReuImpress-iPhone/Resources/MarkdownReader/THIRD_PARTY_LICENSES.txt
          test -s ../../Scripts/DiagramReader/KATEX_LICENSE.txt
          test -s ../../Scripts/DiagramReader/MARKDOWN_IT_LICENSE.txt
          test -d ../../aReuImpress-iPhone/Resources/MarkdownReader/fonts
          test "$(find ../../aReuImpress-iPhone/Resources/MarkdownReader/fonts -name '*.woff2' -type f | wc -l | tr -d ' ')" -gt 0
          test -s ../../aReuImpress-iPhone/Resources/MarkdownReader/index.html
          cp ../../aReuImpress-iPhone/Resources/DiagramReader/manifest.json ../../out/diagram-engine-manifest.json
          cp ../../aReuImpress-iPhone/Resources/MarkdownReader/manifest.json ../../out/markdown-engine-manifest.json
      - name: Build Debug iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace -scheme aReuImpress-iPhone -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ImpressDebugSim" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee out/debug-simulator-build.log
      - name: Select available iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > out/simulators.json
          SIM_ID=$(python3 - out/simulators.json <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          ids = [d["udid"] for runtime, group in devices.items()
                 if "iOS" in runtime for d in group
                 if d.get("isAvailable", False) and d.get("name", "").startswith("iPhone")]
          print(ids[0] if ids else "")
          PY
          )
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator" | tee out/simulator-error.log
            exit 1
          fi
          # Hosted Xcode 27 can fail to connect to Simulator lockdown when
          # xcodebuild cold-boots the first iPhone. Verify a full boot first.
          # This preflight is fatal on failure; it never bypasses XCTest.
          SIM_STATE=$(python3 - out/simulators.json "$SIM_ID" <<'PY'
          import json, sys
          for group in json.load(open(sys.argv[1]))["devices"].values():
              for device in group:
                  if device["udid"] == sys.argv[2]:
                      print(device.get("state", ""))
                      raise SystemExit(0)
          raise SystemExit("Selected iPhone simulator disappeared")
          PY
          )
          if [ "$SIM_STATE" != "Booted" ]; then
            xcrun simctl boot "$SIM_ID"
          fi
          xcrun simctl bootstatus "$SIM_ID" -b 2>&1 | tee out/simulator-bootstatus.log
          xcrun simctl spawn "$SIM_ID" launchctl list >/dev/null
          echo "IMPRESS_SIMULATOR_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Run native iOS XCTest
        env:
          VALIDATION_SCOPE: ${{ inputs.validation_scope || (github.ref_name == 'feature/impress-duplex-loop-v1' && 'full' || 'chat') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_SCOPE" == "full" ]]; then
            SELECTION=(-only-testing:aReuImpress-iPhoneTests)
          else
            SELECTION=(
              -only-testing:aReuImpress-iPhoneTests/ImpressAIHTTPStreamingIntegrationTests
              -only-testing:aReuImpress-iPhoneTests/ImpressChatPOCRichRenderingTests
              -only-testing:aReuImpress-iPhoneTests/ImpressChatPOCLocalAttachmentTests
              -only-testing:aReuImpress-iPhoneTests/ReviewWCDBRepositoryTests/testProductionChatSystemPickersStayLocalWithRemovablePreviews
              -only-testing:aReuImpress-iPhoneTests/ImpressChatPOCStreamDriverIntegrationTests
              -only-testing:aReuImpress-iPhoneTests/ImpressExcalidrawRenderingIntegrationTests
              -only-testing:aReuImpress-iPhoneTests/ImpressCalibrationIntegrationTests
            )
          fi
          echo "native.scope=$VALIDATION_SCOPE" >> out/ci-test-scope.txt
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace -scheme aReuImpress-iPhone -configuration Debug -destination "platform=iOS Simulator,id=$IMPRESS_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ImpressDebugSim" -resultBundlePath "$PWD/out/ImpressNative.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never "${SELECTION[@]}" \
             CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
             CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/.github/ci/ImpressSimulatorKeychainQA.entitlements" \
             test 2>&1 | tee out/simulator-native-xctest.log
          xcrun xcresulttool get test-results summary --path out/ImpressNative.xcresult --format json > out/native-test-summary.json
      - name: Run real-process iOS XCUITest
        env:
          VALIDATION_SCOPE: ${{ inputs.validation_scope || (github.ref_name == 'feature/impress-duplex-loop-v1' && 'full' || 'chat') }}
        shell: bash
        run: |
          set -euo pipefail
          # A passing native suite is not proof that simulator services stayed
          # healthy. Fail early on a broken boot instead of misreporting UI logic.
          xcrun simctl bootstatus "$IMPRESS_SIMULATOR_ID" -b 2>&1 | tee out/simulator-ui-bootstatus.log
          xcrun simctl spawn "$IMPRESS_SIMULATOR_ID" launchctl list >/dev/null
          if [[ "$VALIDATION_SCOPE" == "full" ]]; then
            SELECTION=(-only-testing:aReuImpress-iPhoneUITests)
          else
            SELECTION=(
              -only-testing:aReuImpress-iPhoneUITests/ImpressChatPOCInteractionUITests
              -only-testing:aReuImpress-iPhoneUITests/ImpressV11NavigationUITests/testNativeJSONCanvasOnlySelectedNodeMovesIntoChat
            )
          fi
          echo "ui.scope=$VALIDATION_SCOPE" >> out/ci-test-scope.txt
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace -scheme aReuImpress-iPhone -configuration Debug -destination "platform=iOS Simulator,id=$IMPRESS_SIMULATOR_ID" -derivedDataPath "$RUNNER_TEMP/ImpressDebugSim" -resultBundlePath "$PWD/out/ImpressUI.xcresult" -parallel-testing-enabled NO -collect-test-diagnostics never "${SELECTION[@]}" \
             CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
             CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/.github/ci/ImpressSimulatorKeychainQA.entitlements" \
             test 2>&1 | tee out/simulator-ui-xctest.log
          xcrun xcresulttool get test-results summary --path out/ImpressUI.xcresult --format json > out/ui-test-summary.json
      - name: Build Release iOS Simulator
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'full') || (github.event_name == 'push' && github.ref_name == 'feature/impress-duplex-loop-v1') }}
        shell: bash
        run: |
          set -euo pipefail
          # App-only Release scheme: the main scheme also builds DEBUG-only XCTest helpers.
          # Native XCTest already ran in the separate signed Debug test step.
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace -scheme aReuImpress-iPhone-AltStore -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ImpressReleaseSim" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee out/release-simulator-build.log
      - name: Compile unsigned Debug iPhoneOS arm64
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_candidate && inputs.validation_scope == 'full') || (github.event_name == 'push' && github.ref_name == 'feature/impress-duplex-loop-v1') }}
        shell: bash
        run: |
          set -euo pipefail
          # The installable QA target must contain only the app, never XCTest bundles.
          # Match the previously successful unsigned ARM64 AltStore CI settings.
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace -scheme aReuImpress-iPhone-AltStore -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ImpressPhone" IPHONEOS_DEPLOYMENT_TARGET=26.0 CODE_SIGNING_ALLOWED=NO CODE_SIGN_ENTITLEMENTS= ENABLE_DEBUG_DYLIB=NO build 2>&1 | tee out/iphoneos-arm64-build.log
      - name: Package and hash unsigned iPhoneOS IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_candidate && inputs.validation_scope == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ImpressPhone/Build/Products/Debug-iphoneos/aReuImpress-iPhone.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/aReuImpress-iPhone"
          test -s "$APP/DiagramReader/reader.js"
          test -s "$APP/DiagramReader/index.html"
          test -s "$APP/DiagramReader/manifest.json"
          test -s "$APP/DiagramReader/THIRD_PARTY_LICENSES.txt"
          # The installable Payload must carry the complete new offline reader,
          # not only the legacy independent diagram resource bundle.
          test -s "$APP/MarkdownReader/index.html"
          test -s "$APP/MarkdownReader/reader.js"
          test -s "$APP/MarkdownReader/graphs.js"
          test -s "$APP/MarkdownReader/katex.min.css"
          test -s "$APP/MarkdownReader/THIRD_PARTY_LICENSES.txt"
          test -s "$APP/MarkdownReader/manifest.json"
          test -d "$APP/MarkdownReader/fonts"
          test "$(find "$APP/MarkdownReader/fonts" -name '*.woff2' -type f | wc -l | tr -d ' ')" -gt 0
          # WidgetKit is part of the actual installable artifact, not just Swift sources.
          WIDGET="$APP/PlugIns/ImpressCalibrationWidgets.appex"
          test -d "$WIDGET"
          test -s "$WIDGET/Info.plist"
          test -s "$WIDGET/ImpressCalibrationWidgets"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET/Info.plist" | grep -qx 'com.apple.widgetkit-extension'
          file "$WIDGET/ImpressCalibrationWidgets" | tee out/widget-mach-o-file.txt
          lipo -info "$WIDGET/ImpressCalibrationWidgets" | tee out/widget-mach-o-architecture.txt
          grep -q arm64 out/widget-mach-o-architecture.txt
          file "$APP/aReuImpress-iPhone" | tee out/mach-o-file.txt
          lipo -info "$APP/aReuImpress-iPhone" | tee out/mach-o-architecture.txt
          grep -q arm64 out/mach-o-architecture.txt
          mkdir -p "$RUNNER_TEMP/ImpressUnsigned/Payload"
          ditto "$APP" "$RUNNER_TEMP/ImpressUnsigned/Payload/aReuImpress-iPhone.app"
          find "$RUNNER_TEMP/ImpressUnsigned/Payload/aReuImpress-iPhone.app" -type d -name '*.xctest' -prune -exec rm -rf '{}' '+'
          if find "$RUNNER_TEMP/ImpressUnsigned/Payload/aReuImpress-iPhone.app" -name '*.xctest' -print -quit | grep -q .; then
            echo 'XCTest plug-in remained in Payload' >&2
            exit 1
          fi
          PUBLIC_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(printf '%s' "$PUBLIC_SHA" | cut -c1-12)
          IPA="$PWD/out/Impress-V3.1-P0P2-$SHORT_SHA-unsigned.ipa"
          ( cd "$RUNNER_TEMP/ImpressUnsigned" && zip -qry "$IPA" Payload )
          unzip -tq "$IPA" | tee out/unzip-integrity.log
          python3 - "$IPA" "$APP/Info.plist" "$PUBLIC_SHA" <<'PY'
          import hashlib, json, plistlib, sys
          from pathlib import Path
          ipa, plist = map(Path, sys.argv[1:3])
          public_sha = sys.argv[3]
          source = json.loads(Path("SOURCE_MANIFEST.json").read_text())
          with plist.open("rb") as f:
              info = plistlib.load(f)
          assert ipa.is_file() and ipa.stat().st_size > 100_000
          report = {
              "public_repository": "aRReuu/Impress-iphone-public-build",
              "public_commit_sha": public_sha,
              "private_source_commit_sha": source["authority"]["source_head_sha"],
              "ipa_file": ipa.name,
              "ipa_size_bytes": ipa.stat().st_size,
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
              "bundle_id": info.get("CFBundleIdentifier"),
              "app_version": info.get("CFBundleShortVersionString"),
              "configuration": "Debug / IMPRESS_V3_CANDIDATE",
              "sdk": "iphoneos / arm64",
              "code_signing": "UNSIGNED; PRIVATE RE-SIGNING REQUIRED",
              "source_policy": "Obsidian production Vault write disabled",
              "physical_device_validation": "NOT TESTED"
          }
          Path("out/package-manifest.json").write_text(json.dumps(report, indent=2))
          Path("out/IPA_SHA256.txt").write_text(
              report["ipa_sha256"] + "  " + ipa.name + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Upload QA logs and optional explicit release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impress-v11-qa-evidence${{ inputs.release_candidate && '-with-explicit-ipa' || '' }}
          path: out/
          retention-days: 14
