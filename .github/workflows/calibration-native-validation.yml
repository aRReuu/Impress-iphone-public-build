name: Impress Calibration Native Integration (Non-Release)

on:
  push:
    branches:
      - feature/impress-calibration-v01
    paths:
      - 'Packages/ImpressReviewCore/**'
      - 'aReuImpress-iPhone/VC/MainVCs/ImCalibrationVC/**'
      - 'aReuImpress-iPhone/Base/**'
      - 'aReuImpress-iPhone/Utils/Public/ImNotification/**'
      - 'aReuImpress-iPhone.xcodeproj/project.pbxproj'
      - 'aReuImpress-iPhoneTests/V3/ImpressCalibrationIntegrationTests.swift'
      - '.github/workflows/calibration-native-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impress-calibration-native-v01
  cancel-in-progress: true

jobs:
  native-validation:
    name: iOS Simulator compile + full XCTest (not an IPA release)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Preserve source and Vault safety baseline
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path("aReuImpress-iPhone/Utils/Public/ImFileManager/ImObsidianManager.swift").read_text()
          assert re.search(r'productionWriteEnabled\s*=\s*false\b', src)
          assert not re.search(r'productionWriteEnabled\s*=\s*true\b', src)
          assert Path("Packages/ImpressReviewCore/Sources/ImpressReviewCore/CalibrationScoreCore.swift").exists()
          assert 'ImpressCalibrationViewController' in Path("aReuImpress-iPhone/Base/ImTabBarViewController.swift").read_text()
          print("CALIBRATION_TEST_SCOPE_AND_VAULT_READONLY PASS")
          PY
      - name: Swift toolchain and portable core tests
        run: |
          set -euo pipefail
          swift --version
          swift test --package-path Packages/ImpressReviewCore --parallel 2>&1 | tee out/swift-core.log
      - name: Create non-icon placeholders and resolve public CocoaPods
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_neutral_assets.py > out/non-icon-assets.json
          pod install --repo-update 2>&1 | tee out/pods.log
      - name: Compile iOS Simulator app and XCTest target
        run: |
          set -euo pipefail
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace \
            -scheme aReuImpress-iPhone -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CalibrationDebug" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee out/build-for-testing.log
      - name: Run real simulator XCTest
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > out/simulator-devices.json
          SIM_ID="$(python3 - <<'PY'
          import json
          js=json.load(open("out/simulator-devices.json"))
          xs=[(k,x['udid']) for k,v in js['devices'].items() for x in v
              if 'iOS' in k and x.get('isAvailable',False)
              and x.get('name','').startswith('iPhone')]
          assert xs, "No available iPhone Simulator"
          xs.sort(reverse=True)
          print(xs[0][1])
          PY
          )"
          xcodebuild -workspace aReuImpress-iPhone.xcworkspace \
            -scheme aReuImpress-iPhone -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/CalibrationDebug" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$GITHUB_WORKSPACE/out/Calibration.xcresult" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee out/ios-xctest.log
          xcrun xcresulttool get test-results summary \
            --path out/Calibration.xcresult --format json > out/test-summary.json || true
      - name: Upload code validation evidence (no IPA release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-native-validation-evidence
          path: |
            out/swift-core.log
            out/pods.log
            out/non-icon-assets.json
            out/build-for-testing.log
            out/ios-xctest.log
            out/test-summary.json
          retention-days: 14
