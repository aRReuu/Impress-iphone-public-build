<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; navigate-to 'none'">
<style id="impress-reading-css"></style>
<style>
:root{color-scheme:light dark}
html,body{padding:0;margin:0;width:100%;overflow-x:hidden}
#reader{min-height:100vh}
#reader .markdown-body{max-width:none!important;padding:12px 8px 48px!important}
.markdown-body ul,.markdown-body ol{padding-inline-start:1.45em;list-style-position:outside}
.markdown-body li{margin:0.28em 0;padding-inline-start:0.12em}
.markdown-body li>ul,.markdown-body li>ol{margin-top:0.34em;margin-bottom:0.35em}
.markdown-body li>p{margin:0.3em 0}
.markdown-body h1{font-size:1.6em}.markdown-body h2{font-size:1.4em}
.markdown-body h3{font-size:1.22em}.markdown-body h4{font-size:1.11em}
.markdown-body h5{font-size:1.04em}.markdown-body h6{font-size:1em}
.markdown-body .im-task{pointer-events:none;margin-inline-end:0.38em;accent-color:var(--im-ink)}
.markdown-body .im-diagram{position:relative;margin:1em 0;padding:0.8em 0.25em;
 border-radius:10px;border:1px solid var(--im-border,#9995);overflow:auto;
 background:var(--im-paper,transparent)}
.markdown-body .im-diagram svg{display:block;max-width:none;min-width:min(100%,320px)}
.markdown-body .im-diagram.markmap{min-height:280px;overflow:hidden}
.markdown-body .im-diagram.markmap svg{width:100%;height:320px;touch-action:pan-x pan-y pinch-zoom}
.markdown-body .im-diagram-error{font-size:0.85em;color:var(--im-muted,#888);padding:0.7em}
.markdown-body .im-diagram-error details pre{white-space:pre-wrap;word-break:break-word}
.markdown-body blockquote{border-radius:0 8px 8px 0}
.markdown-body table{border-collapse:collapse}.markdown-body table td,.markdown-body table th{padding:7px 9px}
.markdown-body pre{white-space:pre;overflow-x:auto}
.markdown-body a{overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style></head>
<body><main id="reader" class="markdown-body" aria-label="Markdown 阅读正文"></main>
<script src="reader.js"></script></body></html>
